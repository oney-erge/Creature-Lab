name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run creature-lab zoo check-showcases
          uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: creature-lab-distributions
          path: dist/*
          if-no-files-found: error

  # Publishing is intentionally not automatic. Download the verified artifacts,
  # inspect them, then publish only after the PyPI trusted-publisher environment is
  # configured and an explicit public-release decision has been made.
