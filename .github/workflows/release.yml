name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run creature-lab zoo check-showcases
          uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creature-lab-distributions
          path: dist/*
          if-no-files-found: error

  # Publishing is intentionally not automatic. Download the verified artifacts,
  # inspect them, then publish only after the PyPI trusted-publisher environment is
  # configured and an explicit public-release decision has been made.
