name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds, tests and smoke-installs the package, attaches
# the wheel and sdist to the release, then publishes them to PyPI through trusted publishing (the
# protected `pypi` environment; no token in the repository). Run it by hand to build and check
# without publishing.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the distributions to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.11
      - run: uv sync --all-extras
      - run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run creature-lab zoo check-showcases
          uv build
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(uv run python -c "import creature_lab; print(creature_lab.VERSION)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/release-venv"
          uv pip install --python "$RUNNER_TEMP/release-venv" dist/creature_lab-*.whl
          "$RUNNER_TEMP/release-venv/bin/creature-lab" --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: creature-lab-distributions
          path: dist/*
          if-no-files-found: error
      - name: Attach the distributions to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    if: github.event_name == 'release'
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: creature-lab-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
