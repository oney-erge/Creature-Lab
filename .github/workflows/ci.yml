name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launchers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os != 'Windows'
        run: bash -n run.sh run.command
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path run.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }

  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-suffix: quality-and-package
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync all local/test integrations
        run: uv sync --all-extras
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Full test suite
        run: uv run pytest
      - name: CLI and behavioral contracts
        run: |
          uv run creature-lab doctor
          uv run creature-lab validate examples/tripod.json --task examples/crawl_forward.json
          uv run creature-lab zoo validate-all
          uv run creature-lab zoo check-showcases
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet "$(ls dist/*.whl)[sim]"
          mkdir -p /tmp/wheel-smoke
          cd /tmp/wheel-smoke
          /tmp/wheel-venv/bin/creature-lab doctor
          /tmp/wheel-venv/bin/creature-lab zoo run quadruped --runs-dir ./runs

  supported-platforms:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            physics-extra: sim
          - os: windows-latest
            python: "3.11"
            physics-extra: sim
          - os: windows-latest
            python: "3.12"
            physics-extra: sim
          - os: macos-latest
            python: "3.11"
            physics-extra: mujoco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-suffix: supported-${{ matrix.os }}-${{ matrix.python }}
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Sync runtime and test dependencies
        run: uv sync --extra dev --extra ${{ matrix.physics-extra }} --extra viz --extra export --extra evolve
      - name: Platform test suite
        run: uv run pytest -m "not optional_backend"
      - name: Launcher and CLI smoke
        run: |
          uv run python scripts/start.py --dry-run
          uv run creature-lab validate examples/tripod.json --task examples/crawl_forward.json

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-suffix: browser-smoke
      - name: Set up Python
        run: uv python install 3.11
      - name: Install editor and browser dependencies
        run: |
          uv sync --extra sim --extra viz --extra browser
          uv run playwright install --with-deps chromium
      - name: Real first-run browser journey and process cleanup
        run: uv run python scripts/browser_smoke.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --detach --build
      - run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080 && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down --volumes
