name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launchers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: bash -n run.sh run.command
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path run.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
      - if: runner.os == 'Windows'
        name: Launcher helpers under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-launcher-helpers.ps1

  first-launch:
    name: first launch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: first-launch-${{ matrix.os }}
      - name: Start the app with the real launcher and check it
        shell: bash
        run: |
          # One step on purpose: on Windows a process started in an earlier step is gone by now.
          if [ "$RUNNER_OS" = "Windows" ]; then
            # What run.bat does: Windows PowerShell 5.1.
            powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File run.ps1 -NoBrowser > launch.log 2>&1 &
          else
            nohup ./run.sh --no-browser > launch.log 2>&1 &
          fi
          ready=0
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/api/health; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "The app did not come up within 6 minutes."
            tail -n 120 launch.log || true
            exit 1
          fi
          echo
          # No package was compiled from source: PyBullet must stay optional.
          uv run --no-sync python -c "import importlib.util as u; assert u.find_spec('pybullet') is None, 'PyBullet must stay optional'; import fastapi, mujoco, viser, onnxruntime"
          curl -fsS http://127.0.0.1:8080/api/robots | python -c "import json, sys; keys = [r['key'] for r in json.load(sys.stdin)['robots']]; assert keys == ['microduck', 'unitree_g1', 'unitree_h1', 'unitree_h1_2'], keys"

  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: quality-and-package
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync all local/test integrations
        run: uv sync --all-extras
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Full test suite
        run: uv run pytest
      - name: CLI and behavioral contracts
        run: |
          uv run creature-lab doctor
          uv run creature-lab validate examples/tripod.json --task examples/crawl_forward.json
          uv run creature-lab zoo validate-all
          uv run creature-lab zoo check-showcases
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet "$(ls dist/*.whl)[sim]"
          mkdir -p /tmp/wheel-smoke
          cd /tmp/wheel-smoke
          /tmp/wheel-venv/bin/creature-lab doctor
          /tmp/wheel-venv/bin/creature-lab zoo run quadruped --runs-dir ./runs

  supported-platforms:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            physics-extra: sim
          - os: windows-latest
            python: "3.11"
            physics-extra: sim
          - os: windows-latest
            python: "3.12"
            physics-extra: sim
          - os: macos-latest
            python: "3.11"
            physics-extra: mujoco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: supported-${{ matrix.os }}-${{ matrix.python }}
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Sync runtime and test dependencies
        run: uv sync --extra ${{ matrix.physics-extra }} --extra viz --extra export --extra evolve
      - name: Platform test suite
        run: uv run pytest -m "not optional_backend"
      - name: Launcher and CLI smoke
        run: |
          uv run python scripts/start.py --dry-run
          uv run creature-lab validate examples/tripod.json --task examples/crawl_forward.json

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-suffix: browser-smoke
      - name: Set up Python
        run: uv python install 3.11
      - name: Install editor and browser dependencies
        run: |
          uv sync --extra sim --extra viz --extra browser
          uv run playwright install --with-deps chromium
      - name: Real first-run browser journey and process cleanup
        run: uv run python scripts/browser_smoke.py

  frontend:
    # The browser app's source (web-ui/) and the bundle committed in
    # creature_lab/web/static must agree, so users never need Node.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed bundle matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../creature_lab/web/static)" ]; then
            git status --short -- ../creature_lab/web/static
            echo "creature_lab/web/static is stale: run 'npm run build' in web-ui and commit it."
            exit 1
          fi

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up --detach --build
      - run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080 && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down --volumes

  lockfile:
    # uv sync --frozen trusts uv.lock as-is; fail when it no longer matches pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv lock --check

  zizmor:
    # Workflow security audit, pinned and offline so its result changes only
    # with this file or the workflows (settings in .github/zizmor.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx zizmor==1.31.1 --offline --min-severity medium --config .github/zizmor.yml .github/workflows
