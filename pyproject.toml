[project]
name = "creature-lab"
version = "0.2.0"
description = "Failure-first local workbench for designing, diagnosing, and reproducing modular robot experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "robotics",
    "simulation",
    "robot-design",
    "morphology",
    "pybullet",
    "mujoco",
    "education",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
sim = [
    "pybullet>=3.2.6",
    "numpy>=1.26",  # pybullet imports numpy at runtime but does not pin it
]
viz = [
    "viser>=1.0",
    "trimesh>=4.0",  # true capsule meshes in the viewer
    "numpy>=1.26",  # mesh vertex colors
    "matplotlib>=3.8",  # `plot` metric charts
]
export = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",  # enables MP4 output
    "pillow>=10.0",  # enables GIF output
]
llm = [
    "litellm>=1.0",  # provider abstraction for `creature-lab ask` (online mode)
]
evolve = [
    "cmaes>=0.10",  # CMA-ES strategy for `creature-lab evolve --strategy cmaes`
]
mujoco = [
    "mujoco>=3.0",  # MuJoCo backend + MJCF export round-trip (`run --backend mujoco`)
]
browser = [
    # Drives the real build editor in a headless browser for the first-run smoke
    # test (`python scripts/browser_smoke.py`). Catches client-side rendering bugs
    # the fake-GUI unit tests structurally cannot - see docs/BUILD_EDITOR.md.
    # After install, run `python -m playwright install chromium` once.
    "playwright>=1.40",
]
rl = [
    # `creature-lab train` (Grand Plan Phase 5, Tier 3): PPO over CreatureEnv via
    # Stable-Baselines3, which needs the real gymnasium.Env contract - see
    # creature_lab/rl/gym_env.py for why CreatureEnv itself isn't a gymnasium.Env
    # directly (its step()/reset() are an older, already-tested 4-tuple API).
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
creature-lab = "creature_lab.cli:app"

[project.urls]
Homepage = "https://github.com/oney-erge/Creature-Lab"
Repository = "https://github.com/oney-erge/Creature-Lab"
Issues = "https://github.com/oney-erge/Creature-Lab/issues"
Documentation = "https://github.com/oney-erge/Creature-Lab/tree/main/docs"
Changelog = "https://github.com/oney-erge/Creature-Lab/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creature_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# litellm (the `llm` extra) still declares filelock<4, but the October 2026
# filelock CVEs are fixed only in 4.2.1+. litellm calls only FileLock(path,
# timeout, mode) and Timeout, which 4.x keeps (BerriAI/litellm#48635); remove
# this once a litellm release lifts the cap.
override-dependencies = ["filelock>=4.2.1"]
